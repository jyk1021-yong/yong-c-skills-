<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스쿼트 1편 프로토타입</title>
<style>
  :root { --bg: #0e1117; --fg: #f2f4f8; }
  @media (prefers-color-scheme: light) { :root { --bg: #f5f6f8; --fg: #14181f; } }
  :root[data-theme="dark"] { --bg: #0e1117; --fg: #f2f4f8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; width: min(100vw, calc(100vh * 9 / 16), 540px); aspect-ratio: 9 / 16;
    overflow: hidden; border-radius: 16px; background: #1a1f2b; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 24px 20px; text-align: center;
    pointer-events: none; color: #f2f4f8; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #title { font-size: 22px; font-weight: 700; }
  #cue { margin-top: 8px; font-size: 20px; font-weight: 600; min-height: 28px; }
  #legend { position: absolute; left: 0; right: 0; bottom: 24px; display: flex; gap: 8px;
    justify-content: center; flex-wrap: wrap; font-size: 14px; pointer-events: none; }
  .chip { padding: 6px 10px; border-radius: 999px; background: rgba(0,0,0,.5); color: #fff; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #controls { position: absolute; right: 12px; bottom: 90px; display: flex; flex-direction: column; gap: 8px; }
  button { border: 0; border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer;
    background: rgba(255,255,255,.9); color: #14181f; }
  button[aria-pressed="true"] { background: #3b82f6; color: #fff; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="title">스쿼트 · 엉덩이로 내려가기</div>
    <div id="cue"></div>
  </div>
  <div id="controls">
    <button id="btn-xray" aria-pressed="true">X-ray 켜기</button>
    <button id="btn-pause" aria-pressed="false">일시정지</button>
  </div>
  <div id="legend">
    <span class="chip"><span class="dot" style="background:#3b82f6"></span>둔근</span>
    <span class="chip"><span class="dot" style="background:#ef4444"></span>대퇴사두근</span>
    <span class="chip"><span class="dot" style="background:#f97316"></span>햄스트링</span>
    <span class="chip"><span class="dot" style="background:#22c55e"></span>종아리</span>
  </div>
</div>

<script src="three.min.js"></script>
<script src="modules/motion.js"></script>
<script src="modules/character-style.js"></script>
<script src="modules/rig.js"></script>
<script src="modules/skin-primitive.js"></script>
<script>
const { depthAt, activationAt, poseAt, cueAt, pulseAt, CYCLE_MS } = SquatMotion;

// ---- 화면 ----

const canvas = document.getElementById('c');
const frame = document.getElementById('frame');
const cueEl = document.getElementById('cue');
const btnXray = document.getElementById('btn-xray');
const btnPause = document.getElementById('btn-pause');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1f2b);

const camera = new THREE.PerspectiveCamera(35, 9 / 16, 0.1, 100);
camera.position.set(0, 1.1, 4.6);
camera.lookAt(0, 0.95, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(3, 5, 4);
scene.add(key);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(1.6, 48),
  new THREE.MeshStandardMaterial({ color: 0x252b38, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// 조립: 뼈대와 근육(rig), 피부 공급자(skin)
const style = CharacterStyle.resolveStyle();
const rig = SquatRig.buildRig(THREE);
scene.add(rig.root);
const skin = PrimitiveSkin.build(THREE, rig.joints, style);

// 피부 가시성: X-ray 켜면 반투명, 끄면 불투명 (근육이 가려짐)
let xray = true;
skin.setXray(xray);
btnXray.addEventListener('click', () => {
  xray = !xray;
  btnXray.setAttribute('aria-pressed', String(xray));
  btnXray.textContent = xray ? 'X-ray 켜기' : 'X-ray 끄기';
  skin.setXray(xray);
});

let paused = false;
btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.setAttribute('aria-pressed', String(paused));
  btnPause.textContent = paused ? '재생' : '일시정지';
});

// 크기 맞춤
function resize() {
  const w = frame.clientWidth;
  const h = frame.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// 프레임마다 자세와 활성도 적용
let elapsed = 0;
let last = performance.now();
let lastCue = '';

function update(dtMs) {
  if (!paused) elapsed += dtMs;
  const depth = depthAt(elapsed);
  const pose = poseAt(depth);
  const act = activationAt(depth);
  const pulse = pulseAt(elapsed);

  SquatRig.applyPose(rig.joints, pose);
  SquatRig.applyActivation(rig.muscles, act, pulse);

  const cue = cueAt(elapsed);
  if (cue !== lastCue) {
    cueEl.textContent = cue;
    lastCue = cue;
  }
}

function loop(now) {
  const dt = now - last;
  last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

requestAnimationFrame((t) => { last = t; loop(t); });

// 테스트용 노출 (단계 함수 확인)
window.__squat = { depthAt, activationAt, poseAt, cueAt, CYCLE_MS };
</script>
</body>
</html>
